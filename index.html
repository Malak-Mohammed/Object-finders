<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Find the Hidden Fours - Grade 1</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hidden Fours">

    <!-- Include Three.js for 3D world rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        
        #cameraStream {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }

        #setupScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            color: white;
            text-align: center;
            padding: 25px;
        }
        #setupScreen h1 { font-size: 26px; margin-bottom: 12px; }
        #setupScreen p { font-size: 16px; color: #ccc; margin-bottom: 25px; max-width: 320px; line-height: 1.4; }
        #setupBtn {
            padding: 16px 36px;
            font-size: 18px;
            font-weight: bold;
            background: #2ecc71;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }

        #feedbackPopup {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(46, 204, 113, 0.95);
            color: white;
            padding: 15px 30px;
            font-size: 26px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #feedbackPopup.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <video id="cameraStream" autoplay playsinline muted></video>
    <div id="canvas-container"></div>
    <div id="feedbackPopup">🎉 Great Job!</div>

    <div id="setupScreen">
        <h1>⭐ Number 4 Scavenger Hunt</h1>
        <p>Stand in the center of the room, point your phone forward, and tap below to start!</p>
        <button id="setupBtn" onclick="startExperience()">Start Game</button>
    </div>

    <script>
        let camera, scene, renderer;
        let interactiveObjects = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        
        let initialAlpha = null;
        let initialBeta = null;
        let isCalibrated = false;

        async function startExperience() {
            const setupBtn = document.getElementById('setupBtn');
            setupBtn.innerText = "Loading Camera & Sensors...";
            setupBtn.disabled = true;

            // 1. Request iOS Motion Permission
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    await DeviceOrientationEvent.requestPermission();
                } catch (e) {}
            }

            // 2. Start Camera Feed
            const videoElement = document.getElementById('cameraStream');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                videoElement.srcObject = stream;
            } catch (e) {
                try {
                    videoElement.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
                } catch (err) {
                    alert("Camera access is required.");
                    setupBtn.innerText = "Start Game";
                    setupBtn.disabled = false;
                    return;
                }
            }

            // 3. Give the phone 1.5 seconds to settle its compass readings before locking positions
            setupBtn.innerText = "Calibrating Room...";
            setTimeout(() => {
                document.getElementById('setupScreen').style.display = 'none';
                initThreeScene();
            }, 1500);
        }

        function initThreeScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const textureLoader = new THREE.TextureLoader();
            
            // Scattered 360-degree coordinates around the room (Front, Sides, Back)
            const roomPositions = [
                { x: 0,   y: 0.2,  z: -3.5 }, // Front
                { x: 3.2, y: -0.1, z: -2.0 }, // Right
                { x: -3.2,y: 0.4,  z: -2.0 }, // Left
                { x: 0,   y: 0.2,  z: 3.5  }, // Back (Behind student)
                { x: 2.8, y: -0.4, z: 2.2  }, // Back Right
                { x: -2.8,y: 1.2,  z: 2.2  }, // Back Left
                { x: 0,   y: 2.0,  z: -2.5 }  // High Up Front
            ];

            roomPositions.forEach((pos, index) => {
                const imagePath = `images/four${index + 1}.png`;
                
                textureLoader.load(imagePath, (texture) => {
                    const material = new THREE.MeshBasicMaterial({ 
                        map: texture, 
                        transparent: true,
                        blending: THREE.AdditiveBlending 
                    });
                    
                    const geometry = new THREE.PlaneGeometry(1.0, 1.0);
                    const mesh = new THREE.Mesh(geometry, material);
                    
                    mesh.position.set(pos.x, pos.y, pos.z);
                    mesh.userData = { id: index + 1 };
                    
                    scene.add(mesh);
                    interactiveObjects.push(mesh);
                }, undefined, (err) => {
                    const material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
                    const geometry = new THREE.PlaneGeometry(1.0, 1.0);
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.set(pos.x, pos.y, pos.z);
                    mesh.userData = { id: index + 1 };
                    scene.add(mesh);
                    interactiveObjects.push(mesh);
                });
            });

            // Listen to device orientation to rotate view in 360 degrees
            window.addEventListener('deviceorientation', (event) => {
                if (event.alpha === null) return;

                if (!isCalibrated && event.alpha !== null) {
                    initialAlpha = event.alpha;
                    initialBeta = event.beta;
                    isCalibrated = true;
                }

                if (isCalibrated) {
                    let alphaDelta = event.alpha - initialAlpha;
                    let betaDelta = event.beta - (initialBeta || 0);

                    const alphaRad = THREE.MathUtils.degToRad(alphaDelta);
                    const betaRad = THREE.MathUtils.degToRad(betaDelta - 15);
                    
                    camera.rotation.y = -alphaRad;
                    camera.rotation.x = -betaRad;
                }
            });

            window.addEventListener('pointerdown', (event) => {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactiveObjects);

                if (intersects.length > 0) {
                    const hitObject = intersects[0].object;
                    foundFour(hitObject);
                }
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function playWinSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const playTone = (freq, startTime, duration) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + startTime);
                    osc.stop(audioCtx.currentTime + startTime + duration);
                };
                playTone(523.25, 0.0, 0.2);
                playTone(659.25, 0.1, 0.2);
                playTone(783.99, 0.2, 0.4);
            } catch (e) {}
        }

        let remainingFours = 7;

        function foundFour(object) {
            playWinSound();

            scene.remove(object);
            interactiveObjects = interactiveObjects.filter(obj => obj !== object);

            const popup = document.getElementById('feedbackPopup');
            popup.classList.add('show');
            setTimeout(() => {
                popup.classList.remove('show');
            }, 1200);

            remainingFours--;
            if (remainingFours === 0) {
                setTimeout(() => {
                    popup.innerText = "🌟 Amazing! You found all 7 Fours!";
                    popup.classList.add('show');
                }, 1500);
            }
        }
    </script>
</body>
</html>
