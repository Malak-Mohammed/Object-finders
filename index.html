<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Find the Hidden Fours - Grade 1</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hidden Fours">

    <!-- Include Three.js for 3D world rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
        
        #cameraStream {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }

        @keyframes bounceAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes pulseGlow {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 10px 25px rgba(255, 107, 129, 0.6), 0 0 20px rgba(255, 215, 0, 0.4); 
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 0 15px 35px rgba(255, 107, 129, 0.9), 0 0 35px rgba(255, 215, 0, 0.8); 
            }
        }

        @keyframes floatBubble {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
            50% { transform: translateY(-20px) rotate(5deg); opacity: 1; }
            100% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
        }

        @keyframes rainbowBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes popUpEpic {
            0% { transform: translate(-50%, -50%) scale(0.2) rotate(-10deg); opacity: 0; }
            60% { transform: translate(-50%, -50%) scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        }

        #setupScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #FF6B81 0%, #FF416C 40%, #8E44AD 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            color: white;
            text-align: center;
            padding: 20px;
            overflow-y: auto;
        }

        .setup-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 4px solid rgba(255, 255, 255, 0.6);
            border-radius: 40px;
            padding: 30px 20px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: floatBubble 4s ease-in-out infinite;
        }

        .badge-icon {
            font-size: 50px;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
            animation: bounceAnim 2s ease-in-out infinite;
        }

        #setupScreen h1 { 
            font-size: 32px; 
            margin-bottom: 12px; 
            text-shadow: 0 3px 6px rgba(0,0,0,0.3);
            letter-spacing: 0.8px;
            color: #FFF;
            font-weight: 900;
        }

        #setupScreen p { 
            font-size: 16px; 
            color: #FFF5F7; 
            margin-bottom: 24px; 
            line-height: 1.5; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            font-weight: 600;
        }

        #setupBtn {
            padding: 18px 40px;
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700 0%, #FF8C00 100%);
            color: #2C3E50;
            border: 3px solid #FFF;
            border-radius: 50px;
            cursor: pointer;
            animation: pulseGlow 2s infinite;
            transition: transform 0.2s ease, filter 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 8px 25px rgba(255, 140, 0, 0.6);
        }

        #setupBtn:active {
            transform: scale(0.92);
        }

        .teacher-credit {
            margin-top: 22px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.8px;
            color: #FFF;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 22px;
            border-radius: 25px;
            border: 2px dashed rgba(255, 255, 255, 0.5);
        }

        #feedbackPopup {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(46, 204, 113, 0.95);
            color: white;
            padding: 12px 28px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #feedbackPopup.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Epic Victory Overlay */
        #victoryOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ffd1ff 100%);
            background-size: 400% 400%;
            animation: rainbowBg 6s ease infinite;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #victoryOverlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .victory-card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 6px solid #FFF;
            border-radius: 40px;
            padding: 40px 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 0 30px rgba(255,255,255,0.6);
            text-align: center;
            animation: popUpEpic 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .victory-stars {
            font-size: 60px;
            margin-bottom: 15px;
            animation: bounceAnim 1.5s ease-in-out infinite;
        }

        .victory-card h2 {
            font-size: 36px;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-weight: 900;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .victory-card p {
            font-size: 20px;
            color: #fff5f7;
            font-weight: 700;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        #restartBtn {
            padding: 16px 36px;
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: 3px solid #FFF;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 176, 155, 0.5);
            transition: transform 0.2s ease;
            text-transform: uppercase;
        }

        #restartBtn:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <video id="cameraStream" autoplay playsinline muted></video>
    <div id="canvas-container"></div>
    <div id="feedbackPopup">🎉 Great Job!</div>

    <!-- Epic Victory Modal Overlay -->
    <div id="victoryOverlay">
        <div class="victory-card">
            <div class="victory-stars">⭐⭐🌟⭐⭐</div>
            <h2>AMAZING!</h2>
            <p>You found the hidden fours!</p>
            <button id="restartBtn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <div id="setupScreen">
        <div class="setup-card">
            <div class="badge-icon">⭐🔢⭐</div>
            <h1>Number 4 Scavenger Hunt</h1>
            <p>Hold your phone in <b>landscape mode</b>, stand in the center of the room, and tap below to start your adventure!</p>
            <button id="setupBtn" onclick="startExperience()">Start Game</button>
            <div class="teacher-credit">By Teacher Nada</div>
        </div>
    </div>

    <script>
        let camera, scene, renderer;
        let interactiveObjects = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        
        let screenOrientation = 0;
        let deviceEuler = new THREE.Euler();
        let deviceQuaternion = new THREE.Quaternion();
        const zee = new THREE.Vector3(0, 0, 1);
        const cameraQuaternion = new THREE.Quaternion();

        const targetQuaternion = new THREE.Quaternion();
        const q0 = new THREE.Quaternion(); 
        const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); 
        let isCalibrated = false;
        let audioCtx = null;
        let bgMusicInterval = null;

        async function startExperience() {
            const setupBtn = document.getElementById('setupBtn');
            setupBtn.innerText = "Loading Camera & Sensors...";
            setupBtn.disabled = true;

            // Initialize Web Audio context on user tap
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                startBackgroundMusic();
            } catch(e) {}

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    await DeviceOrientationEvent.requestPermission();
                } catch (e) {}
            }

            const videoElement = document.getElementById('cameraStream');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                videoElement.srcObject = stream;
            } catch (e) {
                try {
                    videoElement.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
                } catch (err) {
                    alert("Camera access is required.");
                    setupBtn.innerText = "Start Game";
                    setupBtn.disabled = false;
                    return;
                }
            }

            setupBtn.innerText = "Calibrating Room...";
            setTimeout(() => {
                document.getElementById('setupScreen').style.display = 'none';
                initThreeScene();
            }, 1000);
        }

        // Background music generator for fun immersion
        function startBackgroundMusic() {
            if (!audioCtx) return;
            const notes = [261.63, 329.63, 392.00, 523.25]; // C chord notes
            let index = 0;
            bgMusicInterval = setInterval(() => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = notes[index % notes.length];
                    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.6);
                    index++;
                } catch(e) {}
            }, 800);
        }

        function initThreeScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const textureLoader = new THREE.TextureLoader();
            
            const correctPositions = [
                { x: 0,   y: 0.2,  z: -3.5, file: 'images/four3.png' },
                { x: 3.5, y: -0.1, z: -2.2, file: 'images/four4.png' },
                { x: -3.5,y: 0.4,  z: -2.2, file: 'images/four5.png' },
                { x: 0,   y: 0.2,  z: 3.5,  file: 'images/four6.png' }
            ];

            const wrongPositions = [
                { x: -1.8, y: -0.5, z: -3.0, file: 'images/wrong1.png' },
                { x: 1.8,  y: 0.8,  z: -2.8, file: 'images/wrong2.png' },
                { x: 0,    y: -1.2, z:  2.0, file: 'images/wrong3.png' }
            ];

            correctPositions.forEach((pos, index) => {
                textureLoader.load(pos.file, (texture) => {
                    const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
                    const geometry = new THREE.PlaneGeometry(1.0, 1.0);
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.set(pos.x, pos.y, pos.z);
                    mesh.userData = { type: 'correct', id: index + 1 };
                    scene.add(mesh);
                    interactiveObjects.push(mesh);
                }, undefined, (err) => {
                    createFallbackMesh(pos, 'correct');
                });
            });

            wrongPositions.forEach((pos, index) => {
                textureLoader.load(pos.file, (texture) => {
                    const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
                    const geometry = new THREE.PlaneGeometry(1.0, 1.0);
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.set(pos.x, pos.y, pos.z);
                    mesh.userData = { type: 'wrong', id: index + 1 };
                    scene.add(mesh);
                    interactiveObjects.push(mesh);
                }, undefined, (err) => {
                    createFallbackMesh(pos, 'wrong');
                });
            });

            function createFallbackMesh(pos, type) {
                const material = new THREE.MeshBasicMaterial({ 
                    color: type === 'correct' ? 0x00FF00 : 0xFF0000, 
                    transparent: true, 
                    opacity: 0.9 
                });
                const geometry = new THREE.PlaneGeometry(1.0, 1.0);
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(pos.x, pos.y, pos.z);
                mesh.userData = { type: type };
                scene.add(mesh);
                interactiveObjects.push(mesh);
            }

            window.addEventListener('deviceorientation', onDeviceOrientationChangeEvent, false);
            window.addEventListener('orientationchange', () => {
                screenOrientation = window.orientation || 0;
            }, false);
            screenOrientation = window.orientation || 0;

            window.addEventListener('pointerdown', (event) => {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactiveObjects);

                if (intersects.length > 0) {
                    const hitObject = intersects[0].object;
                    handleTap(hitObject);
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function onDeviceOrientationChangeEvent(event) {
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            const orient = THREE.MathUtils.degToRad(screenOrientation || 0);

            deviceEuler.set(beta, alpha, -gamma, 'YXZ');
            deviceQuaternion.setFromEuler(deviceEuler);
            deviceQuaternion.multiply(q1);
            deviceQuaternion.multiply(new THREE.Quaternion().setFromAxisAngle(zee, -orient));

            if (!isCalibrated) {
                q0.copy(deviceQuaternion).invert();
                isCalibrated = true;
            }

            targetQuaternion.copy(q0).multiply(deviceQuaternion);
        }

        function animate() {
            requestAnimationFrame(animate);
            camera.quaternion.slerp(targetQuaternion, 0.25);
            renderer.render(scene, camera);
        }

        function playSound(type) {
            try {
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }

                if (type === 'win') {
                    const playTone = (freq, startTime, duration) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + startTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(audioCtx.currentTime + startTime);
                        osc.stop(audioCtx.currentTime + startTime + duration);
                    };
                    playTone(523.25, 0.0, 0.2);
                    playTone(659.25, 0.1, 0.2);
                    playTone(783.99, 0.2, 0.4);
                } else if (type === 'victory') {
                    // Epic Grand Victory Arpeggio Sequence
                    const fanfareNotes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
                    fanfareNotes.forEach((note, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = note;
                        gain.gain.setValueAtTime(0.25, audioCtx.currentTime + (idx * 0.15));
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.15) + 0.35);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(audioCtx.currentTime + (idx * 0.15));
                        osc.stop(audioCtx.currentTime + (idx * 0.15) + 0.35);
                    });
                } else {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                    
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        // Set to 3 so the game ends after finding 3 correct ones
        let remainingFours = 3;

        function handleTap(object) {
            const popup = document.getElementById('feedbackPopup');

            if (object.userData.type === 'correct') {
                scene.remove(object);
                interactiveObjects = interactiveObjects.filter(obj => obj !== object);

                remainingFours--;

                if (remainingFours === 0) {
                    // Stop background music and trigger epic victory fanfare & celebration
                    if (bgMusicInterval) clearInterval(bgMusicInterval);
                    playSound('victory');

                    setTimeout(() => {
                        document.getElementById('victoryOverlay').classList.add('show');
                    }, 300);
                } else {
                    playSound('win');
                    popup.style.background = 'rgba(46, 204, 113, 0.95)';
                    popup.innerText = "🎉 Great Job!";
                    popup.classList.add('show');
                    setTimeout(() => {
                        popup.classList.remove('show');
                    }, 1200);
                }
            } else {
                playSound('lose');

                popup.style.background = 'rgba(231, 76, 60, 0.95)';
                popup.innerText = "❌ Try Again!";
                popup.classList.add('show');
                setTimeout(() => {
                    popup.classList.remove('show');
                }, 1000);
            }
        }
    </script>
</body>
</html>
