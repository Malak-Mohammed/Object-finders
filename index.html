<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Find the Hidden Fours - Grade 1</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hidden Fours">

    <!-- Include Three.js for 3D world rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none; /* Let touches pass through canvas to window listener or handle via webgl */
        }
        
        #cameraStream {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }

        #setupScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            color: white;
            text-align: center;
            padding: 25px;
        }
        #setupScreen h1 { font-size: 26px; margin-bottom: 10px; }
        #setupScreen p { font-size: 15px; color: #ccc; margin-bottom: 20px; max-width: 400px; line-height: 1.4; }
        #setupBtn {
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            background: #2ecc71;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }

        #feedbackPopup {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(46, 204, 113, 0.95);
            color: white;
            padding: 12px 28px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #feedbackPopup.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <video id="cameraStream" autoplay playsinline muted></video>
    <div id="canvas-container"></div>
    <div id="feedbackPopup">🎉 Great Job!</div>

    <div id="setupScreen">
        <h1>⭐ Number 4 Scavenger Hunt</h1>
        <p>Hold your phone in <b>landscape mode</b>, stand in the center of the room, and tap below to lock the room!</p>
        <button id="setupBtn" onclick="startExperience()">Start Game</button>
    </div>

    <script>
        let camera, scene, renderer;
        let interactiveObjects = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        
        // Orientation variables
        let screenOrientation = 0;
        let deviceEuler = new THREE.Euler();
        let deviceQuaternion = new THREE.Quaternion();
        const zee = new THREE.Vector3(0, 0, 1);
        const cameraQuaternion = new THREE.Quaternion();

        // Fix rotations to align world orientation
        const targetQuaternion = new THREE.Quaternion();
        const q0 = new THREE.Quaternion(); // initial calibration offset
        const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // -90 deg rotation around X-axis for portrait/landscape alignment
        let isCalibrated = false;

        async function startExperience() {
            const setupBtn = document.getElementById('setupBtn');
            setupBtn.innerText = "Loading Camera & Sensors...";
            setupBtn.disabled = true;

            // 1. Request iOS Motion Permission
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    await DeviceOrientationEvent.requestPermission();
                } catch (e) {}
            }

            // 2. Start Camera Feed
            const videoElement = document.getElementById('cameraStream');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                videoElement.srcObject = stream;
            } catch (e) {
                try {
                    videoElement.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
                } catch (err) {
                    alert("Camera access is required.");
                    setupBtn.innerText = "Start Game";
                    setupBtn.disabled = false;
                    return;
                }
            }

            // 3. Calibrate room sensors
            setupBtn.innerText = "Calibrating Room...";
            setTimeout(() => {
                document.getElementById('setupScreen').style.display = 'none';
                initThreeScene();
            }, 1000);
        }

        function initThreeScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const textureLoader = new THREE.TextureLoader();
            
            // 7 Correct Fours scattered around the room in 3D world space
            const correctPositions = [
                { x: 0,   y: 0.2,  z: -3.5, file: 'images/four1.png' },
                { x: 3.5, y: -0.1, z: -2.2, file: 'images/four2.png' },
                { x: -3.5,y: 0.4,  z: -2.2, file: 'images/four3.png' },
                { x: 0,   y: 0.2,  z: 3.5,  file: 'images/four4.png' },
                { x: 3.0, y: -0.4, z: 2.2,  file: 'images/four5.png' },
                { x: -3.0,y: 1.2,  z: 2.2,  file: 'images/four6.png' },
                { x: 0,   y: 2.0,  z: -2.5, file: 'images/four7.png' }
            ];

            // 3 Wrong / Distractor Numbers
            const wrongPositions = [
                { x: -1.8, y: -0.5, z: -3.0, file: 'images/wrong1.png' },
                { x: 1.8,  y: 0.8,  z: -2.8, file: 'images/wrong2.png' },
                { x: 0,    y: -1.2, z:  2.0, file: 'images/wrong3.png' }
            ];

            // Load Correct Fours
            correctPositions.forEach((pos, index) => {
                textureLoader.load(pos.file, (texture) => {
                    const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
                    const geometry = new THREE.PlaneGeometry(1.0, 1.0);
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.set(pos.x, pos.y, pos.z);
                    mesh.userData = { type: 'correct', id: index + 1 };
                    scene.add(mesh);
                    interactiveObjects.push(mesh);
                }, undefined, (err) => {
                    createFallbackMesh(pos, 'correct');
                });
            });

            // Load Wrong Numbers
            wrongPositions.forEach((pos, index) => {
                textureLoader.load(pos.file, (texture) => {
                    const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
                    const geometry = new THREE.PlaneGeometry(1.0, 1.0);
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.set(pos.x, pos.y, pos.z);
                    mesh.userData = { type: 'wrong', id: index + 1 };
                    scene.add(mesh);
                    interactiveObjects.push(mesh);
                }, undefined, (err) => {
                    createFallbackMesh(pos, 'wrong');
                });
            });

            function createFallbackMesh(pos, type) {
                const material = new THREE.MeshBasicMaterial({ color: type === 'correct' ? 0x00ff00 : 0xff0000, transparent: true, opacity: 0.3 });
                const geometry = new THREE.PlaneGeometry(1.0, 1.0);
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(pos.x, pos.y, pos.z);
                mesh.userData = { type: type };
                scene.add(mesh);
                interactiveObjects.push(mesh);
            }

            // Device Orientation Event Listeners
            window.addEventListener('deviceorientation', onDeviceOrientationChangeEvent, false);
            window.addEventListener('orientationchange', () => {
                screenOrientation = window.orientation || 0;
            }, false);
            screenOrientation = window.orientation || 0;

            window.addEventListener('pointerdown', (event) => {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactiveObjects);

                if (intersects.length > 0) {
                    const hitObject = intersects[0].object;
                    handleTap(hitObject);
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function onDeviceOrientationChangeEvent(event) {
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0; // z
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;   // x
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0; // y
            const orient = THREE.MathUtils.degToRad(screenOrientation || 0);     // screen orientation

            // Standard Three.js / W3C orientation conversion formula
            deviceEuler.set(beta, alpha, -gamma, 'YXZ');
            deviceQuaternion.setFromEuler(deviceEuler);
            deviceQuaternion.multiply(q1); // camera axes adjustment
            deviceQuaternion.multiply(new THREE.Quaternion().setFromAxisAngle(zee, -orient)); // screen rotation adjustment

            if (!isCalibrated) {
                // Lock current heading as center base view upon first motion event
                q0.copy(deviceQuaternion).invert();
                isCalibrated = true;
            }

            // Combine base offset with current sensor orientation
            targetQuaternion.copy(q0).multiply(deviceQuaternion);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Smoothly interpolate camera rotation to prevent jitter
            camera.quaternion.slerp(targetQuaternion, 0.25);

            // Make sure all billboarded numbers face the camera or stay fixed in place
            interactiveObjects.forEach(obj => {
                // If you want numbers to always face you like billboards, uncomment below:
                // obj.quaternion.copy(camera.quaternion);
            });

            renderer.render(scene, camera);
        }

        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                if (type === 'win') {
                    const playTone = (freq, startTime, duration) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + startTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(audioCtx.currentTime + startTime);
                        osc.stop(audioCtx.currentTime + startTime + duration);
                    };
                    playTone(523.25, 0.0, 0.2);
                    playTone(659.25, 0.1, 0.2);
                    playTone(783.99, 0.2, 0.4);
                } else {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                    
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        let remainingFours = 7;

        function handleTap(object) {
            const popup = document.getElementById('feedbackPopup');

            if (object.userData.type === 'correct') {
                playSound('win');
                scene.remove(object);
                interactiveObjects = interactiveObjects.filter(obj => obj !== object);

                popup.style.background = 'rgba(46, 204, 113, 0.95)';
                popup.innerText = "🎉 Great Job!";
                popup.classList.add('show');
                setTimeout(() => {
                    popup.classList.remove('show');
                }, 1200);

                remainingFours--;
                if (remainingFours === 0) {
                    setTimeout(() => {
                        popup.innerText = "🌟 Amazing! You found all 7 Fours!";
                        popup.classList.add('show');
                    }, 1500);
                }
            } else {
                playSound('lose');

                popup.style.background = 'rgba(231, 76, 60, 0.95)';
                popup.innerText = "❌ Try Again!";
                popup.classList.add('show');
                setTimeout(() => {
                    popup.classList.remove('show');
                }, 1000);
            }
        }
    </script>
</body>
</html>
