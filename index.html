<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Room Explorer - Hidden Fours</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Room Fours">

    <!-- Include Three.js for 3D world rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        
        /* Camera Feed Background handled by WebRTC */
        #cameraStream {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }

        /* Setup / Calibration Screen */
        #setupScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            color: white;
            text-align: center;
            padding: 25px;
        }
        #setupScreen h1 { font-size: 24px; margin-bottom: 12px; }
        #setupScreen p { font-size: 15px; color: #ccc; margin-bottom: 25px; max-width: 320px; line-height: 1.4; }
        #setupBtn {
            padding: 16px 36px;
            font-size: 18px;
            font-weight: bold;
            background: #2ecc71;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }

        /* Popup Notification */
        #feedbackPopup {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(46, 204, 113, 0.95);
            color: white;
            padding: 15px 30px;
            font-size: 26px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #feedbackPopup.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <!-- Live Camera Feed -->
    <video id="cameraStream" autoplay playsinline muted></video>

    <!-- Three.js 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Good Job Popup -->
    <div id="feedbackPopup">🎉 Good Job!</div>

    <!-- Setup Screen -->
    <div id="setupScreen">
        <h1>🏫 Room Scavenger Hunt</h1>
        <p>Stand in the center of the room, point your phone forward, and tap below to lock the hidden Fours into place!</p>
        <button id="setupBtn" onclick="initApp()">Lock Room & Start</button>
    </div>

    <script>
        let camera, scene, renderer;
        let interactiveObjects = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        
        let initialOrientation = { alpha: 0, beta: 0, gamma: 0 };
        let isCalibrated = false;

        async function initApp() {
            // 1. Request iOS Motion Permission
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    await DeviceOrientationEvent.requestPermission();
                } catch (e) {}
            }

            // 2. Start Camera Feed
            const videoElement = document.getElementById('cameraStream');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                videoElement.srcObject = stream;
            } catch (e) {
                try {
                    videoElement.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
                } catch (err) {
                    alert("Camera access is required.");
                }
            }

            // Hide setup screen
            document.getElementById('setupScreen').style.display = 'none';

            // 3. Setup Three.js Scene
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Add ambient lighting so textures look natural
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            // 4. Create 7 3D Planes anchored around the room coordinates (X, Y, Z)
            const textureLoader = new THREE.TextureLoader();
            
            // Define 7 fixed room coordinates relative to where the student clicked start
            const roomPositions = [
                { x: 0,   y: 0.5,  z: -4 },  // Front
                { x: 3,   y: 0,    z: -3 },  // Front Right
                { x: -3,  y: 0.2,  z: -3 },  // Front Left
                { x: 4,   y: 1,    z: 1 },   // Far Right
                { x: -4,  y: 0.8,  z: 1 },   // Far Left
                { x: 0,   y: 1.5,  z: -5 },  // High Up Center
                { x: 1.5, y: -0.5, z: -2 }   // Low Down
            ];

            roomPositions.forEach((pos, index) => {
                const imagePath = `images/four${index + 1}.png`;
                
                textureLoader.load(imagePath, (texture) => {
                    const material = new THREE.MeshBasicMaterial({ 
                        map: texture, 
                        transparent: true,
                        blending: THREE.AdditiveBlending // Blends nicely into the room lighting
                    });
                    
                    const geometry = new THREE.PlaneGeometry(1.2, 1.2);
                    const mesh = new THREE.Mesh(geometry, material);
                    
                    mesh.position.set(pos.x, pos.y, pos.z);
                    mesh.userData = { id: index + 1 };
                    
                    scene.add(mesh);
                    interactiveObjects.push(mesh);
                }, undefined, (err) => {
                    // Fallback if image file is missing: create a colored plane
                    const material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
                    const geometry = new THREE.PlaneGeometry(1, 1);
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.set(pos.x, pos.y, pos.z);
                    mesh.userData = { id: index + 1 };
                    scene.add(mesh);
                    interactiveObjects.push(mesh);
                });
            });

            // 5. Capture Initial Orientation as the "Room Center"
            window.addEventListener('deviceorientation', (event) => {
                if (!isCalibrated && event.alpha !== null) {
                    initialOrientation.alpha = event.alpha;
                    initialOrientation.beta = event.beta;
                    initialOrientation.gamma = event.gamma;
                    isCalibrated = true;
                }

                if (isCalibrated && event.alpha !== null) {
                    // Smoothly map phone rotation to camera rotation
                    const alphaRad = THREE.MathUtils.degToRad(event.alpha - initialOrientation.alpha);
                    const betaRad = THREE.MathUtils.degToRad(event.beta - 15); // adjust resting tilt
                    
                    camera.rotation.y = -alphaRad;
                    camera.rotation.x = -betaRad;
                }
            });

            // 6. Handle Tap/Click Interaction to Find Fours
            window.addEventListener('pointerdown', (event) => {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactiveObjects);

                if (intersects.length > 0) {
                    const hitObject = intersects[0].object;
                    foundFour(hitObject);
                }
            });

            // Animation Loop
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // Win sound chime effect
        function playWinSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const playTone = (freq, startTime, duration) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + startTime);
                    osc.stop(audioCtx.currentTime + startTime + duration);
                };
                playTone(523.25, 0.0, 0.2);
                playTone(659.25, 0.1, 0.2);
                playTone(783.99, 0.2, 0.4);
            } catch (e) {}
        }

        let remainingFours = 7;

        function foundFour(object) {
            playWinSound();

            // Remove object from scene permanently
            scene.remove(object);
            interactiveObjects = interactiveObjects.filter(obj => obj !== object);

            // Show Popup
            const popup = document.getElementById('feedbackPopup');
            popup.classList.add('show');
            setTimeout(() => {
                popup.classList.remove('show');
            }, 1200);

            remainingFours--;
            if (remainingFours === 0) {
                setTimeout(() => {
                    popup.innerText = "🌟 Amazing! You found all 7 hidden Fours in the room!";
                    popup.classList.add('show');
                }, 1500);
            }
        }
    </script>
</body>
</html>
